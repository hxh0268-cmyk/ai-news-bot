name: Daily Content - Publish After Approval

# ブランチ名 "content/<topic>/<日付>" のPull RequestがMergeされたときに動く。
# ブランチ名から話題(topic)と対象日付(CONTENT_DATE)を自動的に読み取るため、
# 話題を追加してもこのファイル自体の編集は不要。
#
# 日付をまたいでこのジョブが実行される（例: 再実行が翌日になった場合）と、
# CONTENT_DATE を渡さないと publish.mjs 側が「実行時点の日付」にフォールバックし、
# 存在しない output/<topic>/<今日の日付>/ を探しに行って ENOENT になる
# （generate.yml 側で対策済みだった日付またぎバグと同種）。
# そのため、ブランチ名の日付セグメントを CONTENT_DATE として明示的に渡す。
#
# workflow_dispatch は、上記のように日付をまたいで送信が失敗した場合などに
# 手動で対象日付を指定して復旧させるための入口。

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      topic:
        description: "話題(topic)のslug（例: ai-news）"
        required: true
        default: "ai-news"
      date:
        description: "対象日付 CONTENT_DATE（例: 2026-09-03）"
        required: true

permissions:
  contents: write

jobs:
  publish:
    # ★killスイッチ: KILL_SWITCH が "true" の間は投稿処理は起動しません。
    if: >
      vars.KILL_SWITCH != 'true' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'content/')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 話題(topic)・対象日付(CONTENT_DATE)を決定する
        id: parse
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TOPIC="${{ github.event.inputs.topic }}"
            CONTENT_DATE="${{ github.event.inputs.date }}"
          else
            REF="${{ github.event.pull_request.head.ref }}"
            # "content/<topic>/<日付>" の各部分を取り出す
            TOPIC=$(echo "$REF" | cut -d'/' -f2)
            CONTENT_DATE=$(echo "$REF" | cut -d'/' -f3)
          fi
          echo "検出した話題: $TOPIC / 対象日付: $CONTENT_DATE"
          echo "topic=$TOPIC" >> "$GITHUB_OUTPUT"
          echo "date=$CONTENT_DATE" >> "$GITHUB_OUTPUT"

      - name: STEP4 Zapier webhookへ送信
        env:
          ZAPIER_WEBHOOKS_JSON: ${{ secrets.ZAPIER_WEBHOOKS_JSON }}
          TOPIC: ${{ steps.parse.outputs.topic }}
          CONTENT_DATE: ${{ steps.parse.outputs.date }}
        run: node scripts/publish.mjs

      - name: ledger（重複投稿防止の記録）をmainにコミット
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[${{ steps.parse.outputs.topic }}] ledger更新（投稿記録）"
          file_pattern: "ledger/*.json"

      - name: 失敗時にSlack通知（設定していればのみ動作）
        if: failure()
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -s -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"⚠️ [${{ steps.parse.outputs.topic }}] SNS投稿処理が失敗しました。GitHub Actionsのログを確認してください: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "${{ secrets.SLACK_WEBHOOK_URL }}"
          else
            echo "SLACK_WEBHOOK_URL が未設定のため通知はスキップされました。"
          fi

  # publishジョブ本体のif条件（vars.KILL_SWITCH != 'true' と他条件のAND）はそのまま維持し、
  # 通知だけを別ジョブとして切り出す。条件は publish ジョブと同じイベント条件を保ったまま
  # KILL_SWITCH の比較だけを反転させている。
  notify-kill-switch:
    if: >
      vars.KILL_SWITCH == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'content/')))
    runs-on: ubuntu-latest
    steps:
      - name: KILL_SWITCH作動をSlack通知
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🛑 KILL_SWITCHが有効なため、Daily Content - Publish After Approval はスキップされました: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
