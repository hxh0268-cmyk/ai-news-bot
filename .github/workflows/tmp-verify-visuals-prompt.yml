name: "【一時】背景生成プロンプト修正の検証"

# 一時的なワークフロー（マージ前に削除する）。
# generate-visuals.mjsの「見出しテキストを重ねられるよう」という文言を
# 書き換えた修正が、実際に(1)疑似テキストを誘発しないか (2)見出しテキストが
# 正しく重なって表示されるか、の両方を2件のテストデータで確認する。

on:
  push:
    branches:
      - fix/background-prompt-text-overlay-wording

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/background-prompt-text-overlay-wording

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm install
        run: npm install

      - name: 背景ビジュアルを2枚生成(修正後プロンプト)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ai-news
          CONTENT_DATE: "test-verify"
        run: node scripts/generate-visuals.mjs

      - name: カード2枚(縦長・横長)を生成
        env:
          TOPIC: ai-news
          CONTENT_DATE: "test-verify"
        run: node scripts/render-cards.mjs

      - name: テスト出力をコミット・push(確認用、後で削除する)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ai-news/test-verify/
          git commit -m "test: verify visuals prompt fix output"
          git push origin fix/background-prompt-text-overlay-wording
