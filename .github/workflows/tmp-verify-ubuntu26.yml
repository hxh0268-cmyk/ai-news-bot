name: 【一時】Ubuntu 26.04でのカード・動画生成の確認（APIなし）

# fix/video-duration ブランチでの確認専用。確認が終わったら削除する。
# mainにある9/30分のカードとデータを使い、render-cards.mjs と build-video.sh だけを実行して、
# ffmpegの版・動画の長さ・カード生成の成否を表示する。APIは呼ばず、コミットやpushもしない。

on:
  push:
    branches: [fix/video-duration]
    paths:
      - .github/workflows/tmp-verify-ubuntu26.yml
      - scripts/build-video.sh

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      TOPIC: ai-news
      CONTENT_DATE: "2026-09-30"
    steps:
      - uses: actions/checkout@v4

      # generate-content（Composite Action）と同じ設定にそろえる
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 環境の確認
        run: |
          grep PRETTY_NAME /etc/os-release
          echo "node: $(node -v)"

      - name: npm install
        run: npm install

      - name: ffmpegをインストール（generate-contentと同じ方法）
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: カード生成（render-cards.mjs）
        run: |
          DIR="output/$TOPIC/$CONTENT_DATE"
          rm -f "$DIR"/cards/*.png "$DIR"/cards-x/*.png "$DIR"/cards-x-web/*.webp
          node scripts/render-cards.mjs
          for d in cards cards-x cards-x-web; do
            echo "$d: $(find "$DIR/$d" -type f | wc -l)枚"
          done
          echo "cards/1.png: $(ffprobe -v error -show_entries stream=width,height -of csv=p=0 "$DIR/cards/1.png")"
          echo "cards-x/1.png: $(ffprobe -v error -show_entries stream=width,height -of csv=p=0 "$DIR/cards-x/1.png")"

      - name: 動画生成（main の build-video.sh と、このブランチの build-video.sh）
        run: |
          DIR="output/$TOPIC/$CONTENT_DATE"
          git fetch -q --depth=1 origin main
          git show FETCH_HEAD:scripts/build-video.sh > /tmp/build-video-main.sh
          bash /tmp/build-video-main.sh > /tmp/main.log 2>&1 || { cat /tmp/main.log; exit 1; }
          MAIN_LEN=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$DIR/slideshow.mp4")
          bash scripts/build-video.sh > /tmp/branch.log 2>&1 || { cat /tmp/branch.log; exit 1; }
          BRANCH_LEN=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$DIR/slideshow.mp4")
          {
            echo "## Ubuntu 26.04 での確認結果"
            echo "- OS: $(grep PRETTY_NAME /etc/os-release | cut -d= -f2 | tr -d '\"')"
            echo "- ffmpeg: $(ffmpeg -version | head -1)"
            echo "- カード: cards $(find "$DIR/cards" -type f | wc -l)枚 / cards-x $(find "$DIR/cards-x" -type f | wc -l)枚 / cards-x-web $(find "$DIR/cards-x-web" -type f | wc -l)枚"
            echo "- 動画の長さ（main の build-video.sh）: ${MAIN_LEN}秒"
            echo "- 動画の長さ（このブランチの build-video.sh）: ${BRANCH_LEN}秒"
          } | tee -a "$GITHUB_STEP_SUMMARY"
