name: 【一時】10/5分の記事除外・記載修正に伴うアセット再生成（STEP2〜STEP3c）

# 2026-10-05分（PR #124）の記事除外・記載修正に伴う一時的な再生成ワークフロー。
# 記事1を除外して4件になり（背景画像は番号を1つずつ繰り上げ済み）、旧記事2・4の見出しと
# 旧記事2のstatsを直したため、カード画像（縦長・横長・サイト用WebP、「n/4」表記）・
# サイト・スライドショー動画（4枚×3秒、音声なし）を作り直す。
# STEP1（ニュース収集）と背景画像生成（generate-visuals / Gemini）は実行せず、
# 既存の backgrounds/*.png と修正済みの data.json・top5.json を使う。
# 完了後、このワークフローファイルは削除する。
#
# 実行のきっかけ: content/ai-news/2026-10-05 ブランチへのpushで、かつ
# このワークフローファイル自体が変更に含まれるときだけ動く。
# （Actionsによる自動コミットはGITHUB_TOKENでpushされるため、再実行は起きない）

on:
  push:
    branches:
      - content/ai-news/2026-10-05
    paths:
      - ".github/workflows/temp-regen-2026-10-05.yml"

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm install
        run: npm install

      - name: STEP2 画像カードを生成（4枚）
        env:
          TOPIC: ai-news
          CONTENT_DATE: "2026-10-05"
        run: node scripts/render-cards.mjs

      # GA_MEASUREMENT_IDを渡さないとGA4タグが消えるため、Secretsから渡す（使うSecretsはこれだけ）
      - name: STEP2.5 広告枠付きサイトを生成
        env:
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          TOPIC: ai-news
          CONTENT_DATE: "2026-10-05"
        run: node scripts/render-site.mjs

      - name: ffmpegをインストール
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: STEP3c 静止画スライドショー生成（音声なし）
        env:
          TOPIC: ai-news
          CONTENT_DATE: "2026-10-05"
        run: bash scripts/build-video.sh

      # file_patternは1行で渡す（9/23に複数行指定でdocs/側が漏れた事例あり）
      - name: 再生成結果をこのブランチに直接コミット・push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[ai-news] 10/5分の記事除外・記載修正に伴うアセット再生成（cards/video/site）"
          file_pattern: "output/ai-news/2026-10-05/** docs/ai-news/**"
