name: 【一時】9/28分の記載修正に伴うアセット再生成（STEP2〜STEP3c）

# 2026-09-28分（PR #107）の記載修正に伴う一時的な再生成ワークフロー。
# STEP1（ニュース収集）は実行せず、修正済みのoutput/ai-news/2026-09-28/data.json・
# top5.jsonを使って、カード画像・ナレーション音声・サイトHTML・スライドショー動画だけを
# 作り直す。完了後、このワークフローファイルは削除する。
#
# 実行のきっかけ: content/ai-news/2026-09-28 ブランチへのpushで、かつ
# このワークフローファイル自体が変更に含まれるときだけ動く。
# （Actionsによる自動コミットはGITHUB_TOKENでpushされるため、再実行は起きない）

on:
  push:
    branches:
      - content/ai-news/2026-09-28
    paths:
      - ".github/workflows/temp-regen-2026-09-28.yml"

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm install
        run: npm install

      - name: STEP2 5枚の画像カードを生成
        env:
          TOPIC: ai-news
          CONTENT_DATE: "2026-09-28"
        run: node scripts/render-cards.mjs

      - name: STEP3b ElevenLabsでナレーション音声を生成
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          TOPIC: ai-news
          CONTENT_DATE: "2026-09-28"
        run: node scripts/generate-narration.mjs

      # generate-narration.mjsは失敗しても終了コード0で続行するため、
      # 古い音声のまま動画が作られないよう、音声が作り直されたことを確認する
      - name: ナレーション音声が作り直されたことを確認
        run: |
          if git diff --quiet -- output/ai-news/2026-09-28/narration.mp3; then
            echo "narration.mp3が更新されていません。ナレーション生成に失敗した可能性があります。"
            exit 1
          fi

      - name: STEP2.5 広告枠付きサイトを生成
        env:
          ADSENSE_CLIENT_ID: ${{ secrets.ADSENSE_CLIENT_ID }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          TOPIC: ai-news
          CONTENT_DATE: "2026-09-28"
        run: node scripts/render-site.mjs

      - name: ffmpegをインストール
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: STEP3c 静止画スライドショー生成＋ナレーション合成
        env:
          TOPIC: ai-news
          CONTENT_DATE: "2026-09-28"
        run: bash scripts/build-video.sh

      # file_patternは1行で渡す（9/23に複数行指定でdocs/側が漏れた事例あり）
      - name: 再生成結果をこのブランチに直接コミット・push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[ai-news] 9/28分の記載修正に伴うアセット再生成（cards/narration/video/site）"
          file_pattern: "output/ai-news/2026-09-28/** docs/ai-news/**"
