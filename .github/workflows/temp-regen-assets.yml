name: 【一時】見出し修正に伴うアセット再生成（STEP2.5のみ・やり直し）

# 前回の実行(f028093)で、cards/narration/videoは正しく再生成・コミットされたが、
# git-auto-commit-actionのfile_patternが複数行YAML文字列として正しく渡らず、
# docs/ai-news/**側だけが欠落してコミットされていなかった（render-site.mjs自体は
# ランナー上で正しく実行され新しい見出しを反映していたが、その結果が永続化されなかった）。
# file_patternを1行にまとめ、render-site.mjsのみ再実行してdocs/を正しくコミットする。

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm install
        run: npm install

      - name: STEP2.5 広告枠付きサイトを生成
        env:
          ADSENSE_CLIENT_ID: ${{ secrets.ADSENSE_CLIENT_ID }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          TOPIC: ai-news
          CONTENT_DATE: "2026-09-23"
        run: node scripts/render-site.mjs

      - name: 再生成結果をこのブランチに直接コミット・push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[ai-news] docs/を再生成（見出し修正のfile_pattern漏れの修正）"
          file_pattern: "docs/ai-news/**"
