name: Daily Content - Generate & Request Check

on:
  schedule:
    # 毎時0分はGitHub Actions全体でスケジュール実行が最も混雑する瞬間で、
    # 遅延の主因になっているため、意図的にキリの良くない分（22:17）にずらしている
    # （2026-09-10の調査で、直近の実行遅延がほぼ一定して103〜128分だったことを確認）。
    - cron: "17 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  # config/topics/ 内のJSONファイルを自動検出し、話題の一覧をマトリクスとして出力する。
  # 新しい話題を増やしたいときは、config/topics/に設定ファイルを1つ追加するだけでよく、
  # このワークフロー自体を編集する必要はない。
  discover-topics:
    runs-on: ubuntu-latest
    outputs:
      topics: ${{ steps.list.outputs.topics }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          TOPICS=$(ls config/topics/*.json | xargs -n1 basename | sed 's/\.json$//' | jq -R . | jq -s -c .)
          echo "検出した話題: $TOPICS"
          echo "topics=$TOPICS" >> "$GITHUB_OUTPUT"

  generate:
    needs: discover-topics
    # ★killスイッチ: Settings > Secrets and variables > Actions > Variables で
    #   KILL_SWITCH を "true" にすると、次回以降このジョブは一切実行されずスキップされます。
    #   緊急停止したい場合は、コードを一切触らずここだけ切り替えてください。
    if: ${{ vars.KILL_SWITCH != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        topic: ${{ fromJson(needs.discover-topics.outputs.topics) }}
    steps:
      - uses: actions/checkout@v4

      # 日付をジョブ開始時に一度だけ確定させる。
      # 深夜帯に複数ステップをまたいで実行すると new Date() の評価タイミングによって
      # ステップごとに日付が変わり、後続スクリプトが前のステップが書いたファイルを
      # 見つけられなくなる（ENOENT）。CONTENT_DATE を全ステップに渡すことで防ぐ。
      - id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # STEP1〜STEP3c（ニュース収集〜カード画像・サイト・動画生成）は
      # regenerate-content.yml（手動の丸ごと再生成）と共通のComposite Actionに
      # まとめている。処理内容を変更する場合は .github/actions/generate-content/action.yml を編集する。
      - name: STEP1〜STEP3c コンテンツ一式を生成
        uses: ./.github/actions/generate-content
        with:
          topic: ${{ matrix.topic }}
          content_date: ${{ steps.date.outputs.date }}
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          elevenlabs_api_key: ${{ secrets.ELEVENLABS_API_KEY }}
          elevenlabs_voice_id: ${{ secrets.ELEVENLABS_VOICE_ID }}
          adsense_client_id: ${{ secrets.ADSENSE_CLIENT_ID }}
          ga_measurement_id: ${{ secrets.GA_MEASUREMENT_ID }}

      - name: 生成物をPull Requestとして提出（★Human Check★）
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "[${{ matrix.topic }}] 本日分のコンテンツを自動生成"
          branch: "content/${{ matrix.topic }}/${{ steps.date.outputs.date }}"
          title: "【要確認・GO判定】${{ matrix.topic }} (${{ steps.date.outputs.date }})"
          body: |
            話題「${{ matrix.topic }}」の本日分の投稿案です。

            - `output/${{ matrix.topic }}/<日付>/cards/1〜5.png`：Instagram/Threads向け画像（縦長）
            - `output/${{ matrix.topic }}/<日付>/cards-x/1〜5.png`：X向け画像（横長）
            - `output/${{ matrix.topic }}/<日付>/slideshow.mp4`：動画（5枚のカード画像による静止画スライドショー＋ナレーション）
            - `output/${{ matrix.topic }}/<日付>/note-article.md`：note販売用の記事ドラフト（手動貼り付け）
            - `output/${{ matrix.topic }}/<日付>/monetization-report.md`：**アフィリエイト・PR表記の確認レポート（必読）**
            - `output/${{ matrix.topic }}/<日付>/humanize-comparison.md`：**文章の「書き直し前・後」を表形式で見比べられる比較ファイル（まずこれを見てください）**
            - `docs/${{ matrix.topic }}/index.html`：広告枠付きの記事サイト

            内容を確認し、問題なければこのPRをMergeしてください。Mergeが「GO」判定になり、
            自動的にSNSへの投稿処理が始まります。
          add-paths: |
            output/${{ matrix.topic }}/**
            docs/${{ matrix.topic }}/**
            docs/robots.txt

      - name: PR作成をSlack通知
        if: steps.create-pr.outputs.pull-request-number != ''
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "📝 [${{ matrix.topic }}] 本日分のコンテンツPRを作成しました: ${{ steps.create-pr.outputs.pull-request-url }}"
            }

      # Composite Action内の各ステップは run-and-capture-error.sh 経由で実行されており、
      # 失敗したステップの出力から要点(Error:行、無ければ末尾の非空行)を
      # .step-error.log に残している。ここでそれを読み出し、失敗Slack通知に含める。
      # PR作成ステップ自体が失敗した場合など、このファイルが無いケースにも対応する。
      - name: 失敗原因の手がかりを抽出
        id: error-snippet
        if: failure()
        run: |
          if [ -f .step-error.log ]; then
            SNIPPET=$(cat .step-error.log)
          else
            SNIPPET="(詳細を取得できませんでした。GitHub Actionsのログを直接確認してください)"
          fi
          {
            echo "snippet<<STEP_ERROR_SNIPPET_EOF"
            echo "$SNIPPET"
            echo "STEP_ERROR_SNIPPET_EOF"
          } >> "$GITHUB_OUTPUT"

      # エラーメッセージには引用符や改行が含まれうるため、slackapi/slack-github-actionの
      # YAMLリテラル埋め込みではなくjqでJSONを組み立ててからcurlで送信し、
      # ペイロードが壊れたり値がシェルとして解釈されたりしないようにしている。
      - name: 失敗時にSlack通知
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TOPIC: ${{ matrix.topic }}
          ERROR_SNIPPET: ${{ steps.error-snippet.outputs.snippet }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT="🚨 [${TOPIC}] 本日のコンテンツ生成が失敗しました。
          原因の手がかり: ${ERROR_SNIPPET}
          ログ: ${RUN_URL}"
          PAYLOAD=$(jq -n --arg text "$TEXT" '{text: $text}')
          curl -sf -X POST -H "Content-Type: application/json" --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"

  notify-kill-switch:
    needs: discover-topics
    if: ${{ vars.KILL_SWITCH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: KILL_SWITCH作動をSlack通知
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🛑 KILL_SWITCHが有効なため、Daily Content - Generate & Request Check はスキップされました: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
