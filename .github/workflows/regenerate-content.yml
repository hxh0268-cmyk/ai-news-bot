name: Regenerate Content (手動・既存ブランチ丸ごと再生成)

# 既存のcontentブランチ（例: content/ai-news/2026-09-06）に対して、
# ニュース収集からカード画像・note記事・サイト・動画までを丸ごと再生成し、
# 同じブランチに直接コミットする（新規PRは作らず、既存PRに反映される）。
#
# 主な用途: 生成済みのPRに重複記事・不適切な内容が含まれていた場合に、
# 該当キーワードを除外指定した上で作り直す。
#
# ★KILL_SWITCHの影響を受けない: 手動実行専用のワークフローのため、
#   意図的に vars.KILL_SWITCH による停止条件を付けていない。

on:
  workflow_dispatch:
    inputs:
      branch:
        description: >
          ⚠️ 課金が発生します（Claude・Gemini・ElevenLabsの全APIを再度呼び出します）。
          再生成対象の既存contentブランチ名（例: content/ai-news/2026-09-06）
        required: true
      exclude_headlines:
        description: "⚠️ こちらも課金対象です。除外したい見出しのキーワードをカンマ区切りで指定（任意）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      # 対象ブランチがComposite Action(.github/actions/generate-content)追加前に
      # 作成されたものだと、ローカルActionの実体がワークスペース上に存在せず
      # 「Can't find 'action.yml'」で失敗する。ローカルActionはcheckoutされた
      # ワークスペース上のファイルをそのまま参照するため、対象ブランチの内容とは
      # 独立して、常に最新mainのComposite Actionをこのパスにだけ反映させる。
      # 対象ブランチは、パイプラインのコード（scripts/・config/）や
      # Composite Action（.github/actions/generate-content）が追加・修正される
      # 前に作成されたものである可能性がある。checkoutしたワークスペース上の
      # ファイルがそのまま使われるため、古いブランチのままだと機能追加・バグ修正が
      # 反映されない状態で再生成してしまう（実際に、重複回避機能が実装される前の
      # ブランチをexclude_headlines付きで再生成したところ、除外指定が一切効かない
      # 不具合が発生した）。
      # 「丸ごと再生成」は常に最新のパイプラインで作り直すことが目的のため、
      # 対象ブランチのoutput/・docs/（＝これから上書きする生成物）以外の
      # パイプライン本体は常に最新mainの内容で上書きする。
      - name: 最新mainのパイプラインコードをワークスペースに反映
        run: |
          git fetch origin main
          git checkout origin/main -- scripts config .github/actions/generate-content

      - name: ブランチ名からtopicと対象日付(CONTENT_DATE)を取り出す
        id: parse
        run: |
          REF="${{ github.event.inputs.branch }}"
          # "content/<topic>/<日付>" の各部分を取り出す
          TOPIC=$(echo "$REF" | cut -d'/' -f2)
          CONTENT_DATE=$(echo "$REF" | cut -d'/' -f3)
          echo "検出した話題: $TOPIC / 対象日付: $CONTENT_DATE"
          echo "topic=$TOPIC" >> "$GITHUB_OUTPUT"
          echo "date=$CONTENT_DATE" >> "$GITHUB_OUTPUT"

      # STEP1〜STEP3cはgenerate.ymlと共通のComposite Actionを使う。
      # 処理内容を変更する場合は .github/actions/generate-content/action.yml を編集する。
      - name: STEP1〜STEP3c コンテンツ一式を再生成
        uses: ./.github/actions/generate-content
        with:
          topic: ${{ steps.parse.outputs.topic }}
          content_date: ${{ steps.parse.outputs.date }}
          exclude_headlines: ${{ github.event.inputs.exclude_headlines }}
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          elevenlabs_api_key: ${{ secrets.ELEVENLABS_API_KEY }}
          elevenlabs_voice_id: ${{ secrets.ELEVENLABS_VOICE_ID }}
          adsense_client_id: ${{ secrets.ADSENSE_CLIENT_ID }}
          ga_measurement_id: ${{ secrets.GA_MEASUREMENT_ID }}

      - name: 再生成結果を既存ブランチにコミット・push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: >-
            [${{ steps.parse.outputs.topic }}] 手動で丸ごと再生成しました
            (除外指定: ${{ github.event.inputs.exclude_headlines || 'なし' }})
          branch: ${{ github.event.inputs.branch }}
          file_pattern: >-
            output/${{ steps.parse.outputs.topic }}/**
            docs/${{ steps.parse.outputs.topic }}/**
            docs/robots.txt

      - name: 再生成成功をSlack通知
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "📝 [${{ steps.parse.outputs.topic }}] ブランチ ${{ github.event.inputs.branch }} を手動で丸ごと再生成しました（除外指定: ${{ github.event.inputs.exclude_headlines || 'なし' }}）: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.event.inputs.branch }}"
            }

      - name: 失敗時にSlack通知
        if: failure()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚨 [${{ steps.parse.outputs.topic }}] ブランチ ${{ github.event.inputs.branch }} の手動再生成が失敗しました。GitHub Actionsのログを確認してください: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
