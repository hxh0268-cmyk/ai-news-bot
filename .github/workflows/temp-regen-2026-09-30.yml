name: 【一時】9/30分の記載修正に伴うアセット再生成（STEP2〜STEP3c）

# 2026-09-30分（PR #112）の記載修正に伴う一時的な再生成ワークフロー。
# STEP1（ニュース収集）は実行せず、修正済みのoutput/ai-news/2026-09-30/data.json・
# top5.jsonを使って、カード画像・サイトHTML・スライドショー動画（音声なし）だけを
# 作り直す。完了後、このワークフローファイルは削除する。
#
# 実行のきっかけ: content/ai-news/2026-09-30 ブランチへのpushで、かつ
# このワークフローファイル自体が変更に含まれるときだけ動く。
# （Actionsによる自動コミットはGITHUB_TOKENでpushされるため、再実行は起きない）

on:
  push:
    branches:
      - content/ai-news/2026-09-30
    paths:
      - ".github/workflows/temp-regen-2026-09-30.yml"

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm install
        run: npm install

      - name: STEP2 5枚の画像カードを生成
        env:
          TOPIC: ai-news
          CONTENT_DATE: "2026-09-30"
        run: node scripts/render-cards.mjs

      - name: STEP2.5 広告枠付きサイトを生成
        env:
          ADSENSE_CLIENT_ID: ${{ secrets.ADSENSE_CLIENT_ID }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          TOPIC: ai-news
          CONTENT_DATE: "2026-09-30"
        run: node scripts/render-site.mjs

      - name: ffmpegをインストール
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: STEP3c 静止画スライドショー生成（音声なし）
        env:
          TOPIC: ai-news
          CONTENT_DATE: "2026-09-30"
        run: bash scripts/build-video.sh

      # file_patternは1行で渡す（9/23に複数行指定でdocs/側が漏れた事例あり）
      - name: 再生成結果をこのブランチに直接コミット・push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[ai-news] 9/30分の記載修正に伴うアセット再生成（cards/video/site）"
          file_pattern: "output/ai-news/2026-09-30/** docs/ai-news/**"
